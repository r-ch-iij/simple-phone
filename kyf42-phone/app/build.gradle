plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'io.github.r_ch_iij.simplephone'
    compileSdk 34

    defaultConfig {
        applicationId "io.github.r_ch_iij.simplephone"
        versionCode 11
        versionName "3.0"

        externalNativeBuild {
            cmake {
                cFlags += "-std=c99"
                arguments += "-DANDROID_STL=c++_shared"
            }
        }

        ndk {
            abiFilters 'armeabi-v7a'
        }
    }

    // 機種別フレーバー: 同一ソースから KYF39 / KYF42 用 APK を出し分ける。
    // 実行時の機種差（ソフトキーコード等）は Build.DEVICE 参照で吸収する。
    flavorDimensions "device"
    productFlavors {
        kyf39 {
            dimension "device"
            // KYF39 (Android 5.1.1 / API 22)。targetSdk 22 で
            // ランタイムパーミッション無効（インストール時許可）になる。
            minSdk 22
            targetSdk 22
            versionNameSuffix "-kyf39"
        }
        kyf42 {
            dimension "device"
            minSdk 28
            targetSdk 29
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }

    buildFeatures {
        buildConfig = true
    }

    buildTypes {
        // 着信音・バイブの有無は BuildConfig.DEBUG で判定
        // （NotificationHelper.startRinging 参照）。
        // debug=無音、release=着信音・バイブあり
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // targetSdk はフレーバー別（kyf39=22 / kyf42=29）。
    // 本アプリはサイドロード運用（Google Play 非公開）のため Play 要件の lint を無効化。
    lint {
        disable 'ExpiredTargetSdkVersion', 'OldTargetApi'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.10.1'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    // ZXing Core 3.4.x calls Java APIs such as List.sort() that are unavailable on
    // KYF39 (Android 5.1.1 / API 22) without core-library desugaring. JourneyApps
    // recommends Core 3.3.0 for API 19-23, so exclude its 3.4.1 transitive dependency.
    implementation('com.journeyapps:zxing-android-embedded:4.3.0') {
        transitive = false
    }
    implementation 'com.google.zxing:core:3.3.0'
    testImplementation 'junit:junit:4.13.2'
}
